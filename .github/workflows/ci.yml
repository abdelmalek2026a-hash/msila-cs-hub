name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
